# =============================================================================
# decision_calendar.yaml - dated funding and programme decisions
# =============================================================================
# WHAT THIS FILE IS
#   The decision points that sit on the same time axis as the implementation
#   roadmaps: ESA Councils at Ministerial Level (subscriptions to optional
#   programmes) and the HUMANS funding and procurement milestones. The policy
#   layer counts the decision points that fall inside each implementation path
#   (funding-cycle exposure). A path that crosses a decision depends on renewed
#   commitment as well as on technical progress.
#
# READ BY
#   src/eri/policy_layer.py -> load_calendar(), funding_cycle_exposure()
#
# RULES
#   - Every dated event cites the page that states the date.
#   - A date that no source states stays null. `date_status` says why:
#       stated_in_source            day and month given by the source
#       year_only_in_source         the source gives the year only
#       not_announced_in_reviewed_sources
#       author_input_required       only the project team can supply it
#   - An event with a null date that could fall inside a path makes the
#     exposure a LOWER BOUND, never zero.
#   - HUMANS structure, procurement release and readiness window are NOT
#     repeated here: they live in capability_planning.yaml (source
#     HUMANS-USER-2026-09-21) and the policy layer reads them from there.
#   - applies_to is a modelling choice (which decisions govern which case),
#     flagged analyst_mapping.
# =============================================================================
