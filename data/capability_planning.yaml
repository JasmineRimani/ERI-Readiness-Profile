planning_rule: ASAP list schedule with deterministic task priority and single-capacity named resources; not an optimal
  resource schedule
cost_scope: development and correction work plus incremental water and holding; hardware procurement prices excluded;
  not whole-programme cost
source_interpretation:
- ESA ACLS reports support a European integrated air-process heritage route. They do not qualify the selected lander
  or ANALOGS configuration.
- An ESA membrane-experiment report supports a European membrane development route. The older UF/RO report supports
  a different process route, not the selected membrane performance.
- A NASA report on a Sabatier development unit gives a non-European alternative. European high-temperature electrolysis
  requires process redesign assessment, not a direct PEM substitution.
scope_notes:
- A reviewed ESA early-R&D impact study supports a staged terrestrial-to-space method only; its food-system costs
  and dates are not transferred to ECLSS.
